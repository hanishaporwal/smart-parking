<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="ParkWay logo" fill="none">
  <defs>
    <linearGradient id="pw-tile-grad" x1="0.12" y1="0.1" x2="0.88" y2="0.9">
      <stop offset="0%" stop-color="#FFD34D" />
      <stop offset="38%" stop-color="#F5A623" />
      <stop offset="75%" stop-color="#E28514" />
      <stop offset="100%" stop-color="#C9680F" />
    </linearGradient>
    <radialGradient id="pw-gloss-grad" cx="0.22" cy="0.22" r="0.42">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <filter id="pw-dest-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2.4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
