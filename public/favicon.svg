      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <rect x="9.5" y="10" width="81" height="78.5" rx="21" fill="url(#pw-tile-grad)" filter="url(#pw-tile-shadow)" />
  <rect x="9.5" y="10" width="81" height="78.5" rx="21" fill="none" stroke="rgba(180, 85, 10, 0.4)" stroke-width="0.65" />
  <rect x="9.5" y="10" width="81" height="78.5" rx="21" fill="url(#pw-gloss-grad)" />

  <g fill="#1C1C1E">
    <path d="M 30.2 71.5 L 30.2 28.5 C 30.2 24, 34 22.2, 39 22.2 L 55 22.2 C 67.5 22.2, 76.5 29.5, 76.5 39.7 C 76.5 49.8, 67.5 57.2, 55 57.2 L 43.5 57.2"
