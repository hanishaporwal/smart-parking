<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0E0C0A" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="ParkWay — a digital twin of an ultrasonic parking guidance system that lights the way to the nearest vacant slot."
    />
    <meta property="og:title" content="ParkWay - Follow the light to the nearest free slot" />
    <meta
      property="og:description"
      content="Follow the light to the nearest free slot. High-fidelity digital twin of an ultrasonic smart parking guidance system with visual LED strip navigation."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/apple-touch-icon.png" />
    <title>ParkWay - Follow the light to the nearest free slot</title>
    <!-- Preload primary UI font weights (400 & 600) for zero layout shift -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/hanken-grotesk/files/hanken-grotesk-latin-600-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body class="bg-bg text-text font-ui antialiased min-h-screen selection:bg-gold/25 selection:text-gold">
    <!-- Liquid refraction SVG filter — progressive enhancement for Chromium floating capsules -->
    <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
      <defs>
        <filter id="liquid-refraction" x="-10%" y="-10%" width="120%" height="120%">
          <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
